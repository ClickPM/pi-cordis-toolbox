name: Publish

# Tag-driven releases only: `npm version patch && git push --follow-tags`.
# A plain push to master never publishes.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # required for npm trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm ci

      # The codex-subagent live round-trip self-skips here: no codex CLI on the runner.
      - run: npm run check

      - run: npm publish
